---
services:
  es_server:
    environment:
      MYSQL_USER: "helferinnensystem"
      MYSQL_PASSWORD: ""
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: "helferinnensystem"
    restart: unless-stopped
    volumes:
      - ../config/config.php:/var/www/config/config.php:ro
    secrets:
      - db_password
  es_database:
    environment:
      MYSQL_DATABASE: helferinnensystem
      MYSQL_USER: helferinnensystem
      MYSQL_PASSWORD: ""
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_RANDOM_ROOT_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      - ./dbsetup.sql:/docker-entrypoint-initdb.d/dbsetup.sql:ro
    restart: unless-stopped
    secrets:
      - db_root_password
      - db_password
  backup:
    image: backup
    build:
      context: ..
      dockerfile: docker/backup.Dockerfile
    depends_on:
      - es_database
    environment:
      MYSQL_HOST: es_database
      MYSQL_DATABASE: helferinnensystem
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    networks:
      - database
    volumes:
      - backup:/backup
    restart: unless-stopped
    secrets:
      - db_root_password
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: es_database
    networks:
      - database
      - internet
    ports:
      - "5081:80"
    profiles:
      - dev

volumes:
  backup: {}

secrets:
  db_password:
    file: secrets/mysql_pw.txt
  db_root_password:
    file: secrets/mysql_root_pw.txt
